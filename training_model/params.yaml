MODEL_TYPE: vgg16

IMAGE_SIZE: [224, 224]
CHANNELS: 3
CLASSES: 4
BATCH_SIZE: 16

WEIGHTS: imagenet

INITIAL_EPOCHS: 10
FINETUNE_EPOCHS: 25

INITIAL_LEARNING_RATE: 0.001
FINETUNE_LEARNING_RATE: 0.00001

DROPOUT: 0.40
DENSE_UNITS: 256

OPTIMIZER: adam
LOSS: categorical_crossentropy

CLASS_WEIGHTING: true

EARLY_STOPPING: true
EARLY_STOPPING_PATIENCE_INITIAL: 4
EARLY_STOPPING_PATIENCE_FINETUNE: 5

REDUCE_LR: true
REDUCE_LR_FACTOR: 0.2
REDUCE_LR_PATIENCE: 2
MIN_LEARNING_RATE: 0.0000001

GRADIENT_CLIPNORM: 1.0

FINE_TUNE_LAST_BLOCK: true
FINE_TUNE_BLOCKS: [5]

AUGMENTATION: true
ROTATION_FACTOR: 0.05
ZOOM_FACTOR: 0.10
TRANSLATION_FACTOR: 0.10
HORIZONTAL_FLIP: true
VERTICAL_FLIP: false

USE_GRADCAM: true
PRIMARY_METRIC: macro_recall

CLASS_NAMES:
  - Normal
  - Cyst
  - Stone
  - Tumor
