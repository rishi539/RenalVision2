# RenalVision V2.1 — ConvNeXt-Tiny training hyperparameters
# Must use identical dataset, class mapping, splits, and seed as V2.

MODEL_TYPE: convnext_tiny
IMAGE_SIZE: [224, 224]
CHANNELS: 3
CLASSES: 4
BATCH_SIZE: 16
WEIGHTS: imagenet

# Training schedule (same as V2)
INITIAL_EPOCHS: 10
FINETUNE_EPOCHS: 25
INITIAL_LEARNING_RATE: 0.001
FINETUNE_LEARNING_RATE: 0.00001
DROPOUT: 0.40
DENSE_UNITS: 256
OPTIMIZER: adam
LOSS: categorical_crossentropy
GRADIENT_CLIPNORM: 1.0

# Class imbalance (same strategy as V2)
CLASS_WEIGHTING: true

# Callbacks (same as V2)
EARLY_STOPPING: true
EARLY_STOPPING_PATIENCE_INITIAL: 4
EARLY_STOPPING_PATIENCE_FINETUNE: 5
REDUCE_LR: true
REDUCE_LR_FACTOR: 0.2
REDUCE_LR_PATIENCE: 2
MIN_LEARNING_RATE: 0.0000001

# Fine-tuning: unfreeze last 20% of backbone (matches V2 FINE_TUNE_FRACTION)
FINE_TUNE_FRACTION: 0.20

# Medical-image augmentation (V2.1 adds Cutout on top of V2 augmentation)
AUGMENTATION: true
ROTATION_DEGREES: 5
ZOOM_FACTOR: 0.10
TRANSLATION_FACTOR: 0.05
HORIZONTAL_FLIP: false
VERTICAL_FLIP: false
# Cutout/RandomErasing params (new in V2.1, per diagnostic recommendation)
CUTOUT_ENABLED: true
CUTOUT_MIN_SIZE: 16
CUTOUT_MAX_SIZE: 32
CUTOUT_PROB: 0.50

# Evaluation
PRIMARY_METRIC: macro_recall
GRADCAM_SAMPLES_PER_CLASS: 2
SEED: 42

# Dataset — same root as V2
DATASET_ROOT: archive/CT-KIDNEY-DATASET-Normal-Cyst-Tumor-Stone/CT-KIDNEY-DATASET-Normal-Cyst-Tumor-Stone

# Class order — MUST match V2 exactly
CLASS_NAMES:
  - Normal
  - Cyst
  - Stone
  - Tumor

# ConvNeXt-Tiny Grad-CAM target layers
# Semantic (deep, 7x7x768): final stage-3 depthwise conv
GRADCAM_SEMANTIC_LAYER: convnext_tiny_stage_3_block_2_depthwise_conv
# Structural (spatial, 14x14x384): final stage-2 depthwise conv
GRADCAM_STRUCTURAL_LAYER: convnext_tiny_stage_2_block_8_depthwise_conv
GRADCAM_SEMANTIC_WEIGHT: 0.70
GRADCAM_STRUCTURAL_WEIGHT: 0.30
